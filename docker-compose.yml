services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey_local_only
      POSTGRES_DB: iit_survey
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - survey_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d iit_survey"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  survey_pg_data:
